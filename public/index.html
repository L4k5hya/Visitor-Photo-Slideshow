<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share your photo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1a1a1a; }
    main { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    p.sub { margin: 0 0 1.25rem; color: #555; }
    form { background: #fff; padding: 1.25rem; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    label.field { display: block; font-weight: 600; margin-bottom: .35rem; }
    input[type=text] { width: 100%; padding: .7rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 8px; }
    input[type=file] { width: 100%; margin: .25rem 0 .75rem; }
    .row { margin-bottom: 1rem; }
    .consent { display: flex; gap: .6rem; align-items: flex-start; font-size: .95rem; line-height: 1.35; }
    .consent input { margin-top: .2rem; width: 1.2rem; height: 1.2rem; flex: none; }
    button { font-size: 1rem; padding: .75rem 1.25rem; border: 0; border-radius: 8px; cursor: pointer; }
    button.primary { background: #2563eb; color: #fff; width: 100%; font-weight: 600; }
    button.primary:disabled { background: #93b4f5; cursor: not-allowed; }
    button.link { background: none; color: #2563eb; padding: 0; text-decoration: underline; font-size: .9rem; }
    #welcome { display: none; background: #eef4ff; padding: .75rem; border-radius: 8px; margin-bottom: 1rem; }
    #previews { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    #previews img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; }
    progress { width: 100%; height: 10px; display: none; margin-bottom: 1rem; }
    #message { margin-top: 1rem; padding: .75rem; border-radius: 8px; display: none; }
    #message.ok { background: #e6f6ea; color: #14532d; }
    #message.err { background: #fde8e8; color: #7f1d1d; }
    small { color: #666; }
    #mine { display: none; margin-top: 1.5rem; }
    #mine-grid { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: .75rem; }
    .thumb img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; display: block; }
    .thumb button { margin-top: .25rem; font-size: .8rem; padding: .3rem .5rem; background: #fde8e8; color: #7f1d1d; }
  </style>
</head>
<body>
<main>
  <h1>Share your photo</h1>
  <p class="sub">Your photo will appear on the big screen right after you upload it.</p>

  <form id="form" novalidate>
    <div id="welcome">
      Welcome back, <strong id="welcomeName"></strong>!
      <button type="button" class="link" id="notYou">Not you?</button>
    </div>

    <div class="row" id="nameRow">
      <label class="field" for="name">Your name</label>
      <input type="text" id="name" maxlength="50" autocomplete="given-name">
    </div>

    <div class="row">
      <label class="field" for="photos">Photos</label>
      <input type="file" id="photos" multiple accept="image/jpeg,image/png,image/webp">
      <small id="limits"></small>
    </div>

    <div id="previews"></div>

    <div class="row">
      <label class="consent">
        <input type="checkbox" id="consent">
        <span>I agree that my name and photos will be <strong>shown publicly</strong> on the
        display screen. I confirm that anyone who appears in the photos is okay with this.</span>
      </label>
    </div>

    <progress id="progress" max="100" value="0"></progress>
    <button type="submit" class="primary" id="submit">Upload</button>
    <div id="message" role="status"></div>
  </form>

  <section id="mine">
    <h2>Your photos</h2>
    <div id="mine-grid"></div>
    <button type="button" class="link" id="eraseAll">Delete all my photos and forget me</button>
  </section>

  <p><small>Watch the screen at <a href="/display.html">/display.html</a>.</small></p>
</main>

<script src="/upload.js" defer></script>
</body>
</html>
