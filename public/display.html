<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitor Slideshow</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font-family: system-ui, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center; }
    #photo { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
    #idle { font-size: 2.5rem; opacity: .7; text-align: center; padding: 2rem; }
    #caption { position: fixed; left: 0; right: 0; bottom: 0; padding: 1.5rem 2rem;
      font-size: 2rem; background: linear-gradient(transparent, rgba(0,0,0,.8)); display: none; }
    #status { position: fixed; top: .5rem; right: .75rem; font-size: .8rem; opacity: .5; }
    #mine { display: none; margin-top: 1.5rem; }
    #mine-grid { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: .75rem; }
    .thumb img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; display: block; }
    .thumb button { margin-top: .25rem; font-size: .8rem; padding: .3rem .5rem; background: #fde8e8; color: #7f1d1d; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="idle">Waiting for the next visitor…</div>
    <img id="photo" alt="Visitor photo">
  </div>
  <div id="caption"></div>
  <div id="status">connecting…</div>

<script>
  const photoEl = document.getElementById('photo');
  const idleEl = document.getElementById('idle');
  const captionEl = document.getElementById('caption');
  const statusEl = document.getElementById('status');

  let durationMs = 10000;
  const queue = [];        // FIFO of slides: { id, url, caption }
  let playing = false;
  let current = null;
  let timer = null;

  fetch('/api/config').then(r => r.json())
    .then(c => { durationMs = c.slideDurationSeconds * 1000; })
    .catch(() => {});

  function enqueue(data) {
    data.newPhotos.forEach(p =>
      queue.push({ id: p.id, url: p.url, caption: data.name }));
    data.previousPhotos.forEach(p =>
      queue.push({ id: p.id, url: p.url, caption: data.name + ' (earlier visit)' }));
    if (!playing) next();
  }

  function preload(url) { const i = new Image(); i.src = url; }

  function next() {
    clearTimeout(timer);
    current = queue.shift() || null;
    if (!current) {
      playing = false;
      photoEl.style.display = 'none';
      captionEl.style.display = 'none';
      idleEl.style.display = 'block';
      return;
    }
    const slide = current;
    playing = true;
    if (queue[0]) preload(queue[0].url);

    photoEl.onload = () => {
      if (current !== slide) return;           // removed or replaced while loading
      idleEl.style.display = 'none';
      photoEl.style.display = 'block';
      captionEl.textContent = slide.caption;   // textContent => no XSS
      captionEl.style.display = 'block';
      timer = setTimeout(next, durationMs);
    };
    photoEl.onerror = () => { if (current === slide) next(); };
    photoEl.src = slide.url;
  }

  // A photo was deleted: drop it from the queue, and skip it if it is on screen now
  function removeSlides(ids) {
    const gone = new Set(ids);
    for (let i = queue.length - 1; i >= 0; i--) {
      if (gone.has(queue[i].id)) queue.splice(i, 1);
    }
    if (current && gone.has(current.id)) next();
  }

  const es = new EventSource('/api/events');
  es.onopen = () => { statusEl.textContent = 'live'; };
  es.onerror = () => { statusEl.textContent = 'reconnecting…'; };
  es.addEventListener('slideshow', (e) => enqueue(JSON.parse(e.data)));
  es.addEventListener('remove', (e) => removeSlides(JSON.parse(e.data).ids));
</script>
</body>
</html>
